spring:
  application:
    name: chainsight-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chainsight}
    username: ${POSTGRES_USER:chainsight_user}
    password: ${POSTGRES_PASSWORD:chainsight_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true

ethereum:
  chain-id: ${ETH_CHAIN_ID:1}
  rpc-url: ${ETH_RPC_URL:https://cloudflare-eth.com}
  ingestion:
    max-range-size: ${ETH_INGESTION_MAX_RANGE_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      ethereumRpc:
        baseConfig: default
