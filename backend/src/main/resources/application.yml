spring:
  application:
    name: chainsight-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chainsight}
    username: ${POSTGRES_USER:chainsight_user}
    password: ${POSTGRES_PASSWORD:chainsight_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true

ethereum:
  chain-id: ${ETH_CHAIN_ID:1}
  rpc-url: ${ETH_RPC_URL:https://cloudflare-eth.com}
  ingestion:
    max-range-size: ${ETH_INGESTION_MAX_RANGE_SIZE:100}
    job-coordinator:
      core-pool-size: ${ETH_JOB_COORDINATOR_CORE_POOL_SIZE:1}
      max-pool-size: ${ETH_JOB_COORDINATOR_MAX_POOL_SIZE:2}
      queue-capacity: ${ETH_JOB_COORDINATOR_QUEUE_CAPACITY:10}
    executor:
      core-pool-size: ${ETH_INGESTION_CORE_POOL_SIZE:4}
      max-pool-size: ${ETH_INGESTION_MAX_POOL_SIZE:8}
      queue-capacity: ${ETH_INGESTION_QUEUE_CAPACITY:50}
    receipt-executor:
      core-pool-size: ${ETH_RECEIPT_CORE_POOL_SIZE:8}
      max-pool-size: ${ETH_RECEIPT_MAX_POOL_SIZE:16}
      queue-capacity: ${ETH_RECEIPT_QUEUE_CAPACITY:200}

analytics:
  network:
    max-limit: ${ANALYTICS_NETWORK_MAX_LIMIT:100}
  cache:
    ttl-seconds: ${ANALYTICS_CACHE_TTL_SECONDS:300}

resilience:
  ingestion-lock:
    ttl-seconds: ${INGESTION_LOCK_TTL_SECONDS:900}
  rate-limit:
    capacity: ${API_RATE_LIMIT_CAPACITY:60}
    refill-tokens-per-second: ${API_RATE_LIMIT_REFILL_TOKENS_PER_SECOND:1}
    key-ttl-seconds: ${API_RATE_LIMIT_KEY_TTL_SECONDS:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      ethereumRpc:
        baseConfig: default
