services:
  backend:
    # On EC2, set BACKEND_IMAGE to your Docker Hub image (e.g. mayuresh/chainsight-backend:latest)
    # and run `docker compose pull && docker compose up -d` — no local build needed.
    # Locally, leave BACKEND_IMAGE unset and `docker compose build` will build from source.
    image: ${BACKEND_IMAGE:-chainsight-backend:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: chainsight-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-86400}
      ETH_RPC_URL: ${ETH_RPC_URL}
      ETH_CHAIN_ID: ${ETH_CHAIN_ID:-1}
      ETH_INGESTION_MAX_RANGE_SIZE: ${ETH_INGESTION_MAX_RANGE_SIZE:-100}
      ETH_JOB_COORDINATOR_CORE_POOL_SIZE: ${ETH_JOB_COORDINATOR_CORE_POOL_SIZE:-1}
      ETH_JOB_COORDINATOR_MAX_POOL_SIZE: ${ETH_JOB_COORDINATOR_MAX_POOL_SIZE:-2}
      ETH_JOB_COORDINATOR_QUEUE_CAPACITY: ${ETH_JOB_COORDINATOR_QUEUE_CAPACITY:-10}
      ETH_INGESTION_CORE_POOL_SIZE: ${ETH_INGESTION_CORE_POOL_SIZE:-4}
      ETH_INGESTION_MAX_POOL_SIZE: ${ETH_INGESTION_MAX_POOL_SIZE:-8}
      ETH_INGESTION_QUEUE_CAPACITY: ${ETH_INGESTION_QUEUE_CAPACITY:-50}
      ETH_RECEIPT_CORE_POOL_SIZE: ${ETH_RECEIPT_CORE_POOL_SIZE:-8}
      ETH_RECEIPT_MAX_POOL_SIZE: ${ETH_RECEIPT_MAX_POOL_SIZE:-16}
      ETH_RECEIPT_QUEUE_CAPACITY: ${ETH_RECEIPT_QUEUE_CAPACITY:-200}
      INGESTION_LOCK_TTL_SECONDS: ${INGESTION_LOCK_TTL_SECONDS:-900}
      API_RATE_LIMIT_CAPACITY: ${API_RATE_LIMIT_CAPACITY:-60}
      API_RATE_LIMIT_REFILL_TOKENS_PER_SECOND: ${API_RATE_LIMIT_REFILL_TOKENS_PER_SECOND:-1}
      AUTH_RATE_LIMIT_CAPACITY: ${AUTH_RATE_LIMIT_CAPACITY:-10}
      AUTH_RATE_LIMIT_REFILL_TOKENS_PER_SECOND: ${AUTH_RATE_LIMIT_REFILL_TOKENS_PER_SECOND:-1}
      API_RATE_LIMIT_KEY_TTL_SECONDS: ${API_RATE_LIMIT_KEY_TTL_SECONDS:-120}
      ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-300}
      MANAGEMENT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_HEALTH_SHOW_DETAILS:-when_authorized}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chainsight_network

  postgres:
    image: postgres:16-alpine
    container_name: chainsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainsight_network

  redis:
    image: redis:7-alpine
    container_name: chainsight-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chainsight_network

  nginx:
    image: nginx:1.27-alpine
    container_name: chainsight-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/chainsight.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - chainsight_network

volumes:
  postgres_data:
  redis_data:

networks:
  chainsight_network:
    driver: bridge
